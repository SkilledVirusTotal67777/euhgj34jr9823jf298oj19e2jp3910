<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMOC</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐧</text></svg>">

  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #181818;
      --header-bg: #222222;
      --accent-color: #4caf50;
      --text-color: #ffffff;
      --msg-bg: #262626;
      --msg-mine-bg: #1e3a29;
      --app-font: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--app-font); }
    body { background-color: var(--bg-color); color: var(--text-color); display: flex; height: 100vh; justify-content: center; align-items: center; }
    
    #login-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 100; }
    .login-box { background: #1e1e1e; padding: 25px; border-radius: 8px; width: 330px; text-align: center; border: 1px solid #333; }
    .login-box h2 { margin-bottom: 10px; color: var(--accent-color); }
    .login-box input { width: 100%; padding: 10px; margin: 8px 0; border-radius: 5px; border: 1px solid #444; background: #2a2a2a; color: #fff; }
    .login-box button { width: 100%; padding: 10px; background: var(--accent-color); border: none; color: #fff; font-weight: bold; border-radius: 5px; cursor: pointer; margin-top: 10px; }
    
    #chat-app { width: 95%; max-width: 1100px; height: 90vh; display: flex; background: var(--card-bg); border-radius: 8px; border: 1px solid #2a2a2a; overflow: hidden; position: relative; }
    
    /* Sidebar */
    sidebar { width: 290px; background: var(--header-bg); border-right: 1px solid #333; display: flex; flex-direction: column; padding: 15px; gap: 15px; overflow-y: auto; }
    
    .mode-switch { display: flex; background: #111; padding: 4px; border-radius: 6px; gap: 4px; }
    .mode-btn { flex: 1; padding: 8px; border: none; background: transparent; color: #888; font-weight: bold; cursor: pointer; border-radius: 4px; font-size: 0.8rem; }
    .mode-btn.active { background: var(--accent-color); color: #fff; }

    .sidebar-section h4 { color: var(--accent-color); margin-bottom: 8px; font-size: 0.85rem; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; }
    
    .user-list { list-style: none; display: flex; flex-direction: column; gap: 4px; }
    .user-item { padding: 8px 10px; border-radius: 5px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; font-size: 0.85rem; background: #1a1a1a; transition: 0.2s; }
    .user-item:hover { background: #2a2a2a; }
    .user-item.active-dm { border-left: 3px solid var(--accent-color); background: #222; }
    .online-dot { width: 8px; height: 8px; background: #4caf50; border-radius: 50%; display: inline-block; }
    .muted-badge { font-size: 0.7rem; color: #ff9800; border: 1px solid #ff9800; padding: 1px 4px; border-radius: 3px; }
    
    .setting-group { margin-bottom: 8px; display: flex; flex-direction: column; gap: 4px; font-size: 0.8rem; }
    .setting-group select, .setting-group input { padding: 6px; border-radius: 4px; border: 1px solid #444; background: #2a2a2a; color: #fff; }

    /* Main Chat */
    main { flex: 1; display: flex; flex-direction: column; position: relative; }
    header { padding: 15px; background: var(--header-bg); border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
    
    #chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    
    .message { background: var(--msg-bg); padding: 10px 14px; border-radius: 6px; max-width: 80%; width: fit-content; }
    .message.mine { background: var(--msg-mine-bg); align-self: flex-end; }
    .message.filtered-msg { background: #222; border: 1px dashed #666; color: #888; font-style: italic; }
    
    .msg-header { font-size: 0.8rem; color: #aaa; margin-bottom: 4px; display: flex; gap: 10px; align-items: center; }
    .msg-author { font-weight: bold; }
    .msg-text { font-size: 1rem; word-break: break-word; }
    
    .actions { display: inline-flex; gap: 6px; margin-left: 8px; }
    .action-icon { cursor: pointer; opacity: 0.7; font-style: normal; font-size: 0.85rem; }
    .action-icon:hover { opacity: 1; }
    
    .admin-btn { font-size: 0.7rem; cursor: pointer; padding: 2px 5px; border-radius: 3px; border: 1px solid; }
    .btn-mute { color: #ff9800; border-color: #ff9800; }
    .btn-ban { color: #ff4d4d; border-color: #ff4d4d; }

    footer { padding: 15px; background: var(--header-bg); display: flex; gap: 10px; position: relative; }
    footer input { flex: 1; padding: 12px; border-radius: 5px; border: 1px solid #444; background: #2a2a2a; color: #fff; }
    footer button { padding: 12px 18px; background: var(--accent-color); border: none; color: #fff; font-weight: bold; border-radius: 5px; cursor: pointer; }
    
    .btn-small { padding: 2px 6px; font-size: 0.75rem; background: #333; border: 1px solid #555; color: #fff; border-radius: 3px; cursor: pointer; }

    /* Emoji Picker Modal */
    #emoji-picker { position: absolute; bottom: 70px; right: 20px; width: 280px; height: 220px; background: #1e1e1e; border: 1px solid #444; border-radius: 8px; display: none; padding: 10px; grid-template-columns: repeat(6, 1fr); gap: 6px; overflow-y: auto; z-index: 50; }
    .emoji-item { font-size: 1.4rem; text-align: center; cursor: pointer; padding: 4px; border-radius: 4px; }
    .emoji-item:hover { background: #333; }
  </style>
</head>
<body>

  <!-- Login Modal -->
  <div id="login-overlay">
    <div class="login-box">
      <h2>SMOC Chat 🐧</h2>
      <p style="font-size: 0.8rem; color: #888; margin-bottom: 10px;">First time? Set a name & PIN to register.<br>Returning? Enter your registered PIN.</p>
      <input type="text" id="username-input" placeholder="Display Name">
      <input type="password" id="pin-input" placeholder="Short PIN">
      <button onclick="login()">Enter Chat</button>
      <div id="login-error" style="color: #ff4d4d; margin-top: 10px; font-size: 0.85rem;"></div>
    </div>
  </div>

  <div id="chat-app">
    <sidebar>
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3>SMOC 🐧</h3>
        <button class="btn-small" onclick="switchAccount()">Sign Out</button>
      </div>
      
      <div class="mode-switch">
        <button id="btn-mode-public" class="mode-btn active" onclick="switchMode('public')">🌐 Public</button>
        <button id="btn-mode-dm" class="mode-btn" onclick="switchMode('dm')">💬 DMs</button>
      </div>

      <div id="dm-sidebar-section" class="sidebar-section" style="display: none;">
        <h4>Active DMs <button class="btn-small" onclick="promptNewDm()">+ New</button></h4>
        <ul id="active-dms-list" class="user-list"></ul>
      </div>

      <div class="sidebar-section">
        <h4>Online Users (<span id="online-count">0</span>)</h4>
        <ul id="online-list" class="user-list"></ul>
      </div>

      <div class="sidebar-section">
        <h4>Customization</h4>
        <div class="setting-group">
          <label>Name Color (`/name`)</label>
          <input type="color" id="color-picker" onchange="updateNameColor(this.value)">
        </div>

        <div class="setting-group">
          <label>Font Style</label>
          <select id="font-select" onchange="changeFont(this.value)">
            <option value="sans-serif">Sans-Serif (Default)</option>
            <option value="monospace">Monospace (Hacker)</option>
            <option value="'Comic Sans MS', cursive">Comic Sans (Playful)</option>
            <option value="Impact, sans-serif">Impact (Loud)</option>
            <option value="'Courier New', monospace">Retro Terminal</option>
            <option value="Georgia, serif">Serif (Classic)</option>
            <option value="'Trebuchet MS', sans-serif">Modern Clean</option>
            <option value="cursive">Cursive</option>
          </select>
        </div>

        <div class="setting-group">
          <label>Theme Preset</label>
          <select id="theme-select" onchange="changeTheme(this.value)">
            <option value="dark">Dark Default</option>
            <option value="sunset">Sunset Glow</option>
            <option value="ocean">Ocean Breeze</option>
            <option value="dracula">Dracula Vamp</option>
            <option value="golden">Golden Luxe</option>
            <option value="matrix">Matrix Green</option>
            <option value="cyberpunk">Cyberpunk</option>
            <option value="light">Light Mode</option>
          </select>
        </div>
      </div>
    </sidebar>

    <main>
      <header>
        <h3 id="room-title">Public Room</h3>
        <span id="user-display" style="font-size: 0.9rem; color: #aaa;"></span>
      </header>
      
      <div id="chat-box"></div>

      <!-- Emoji Picker Grid -->
      <div id="emoji-picker"></div>

      <footer>
        <input type="text" id="message-input" placeholder="Type message... (Commands: /emoji, /name #ff0000)" onkeydown="if(event.key==='Enter') sendMessage()">
        <button type="button" class="btn-small" onclick="toggleEmojiPicker()" style="font-size:1.2rem;">😀</button>
        <button onclick="sendMessage()">Send</button>
      </footer>
    </main>
  </div>

  <script>
    const socket = io();
    let currentUser = '';
    let currentPin = '';
    let currentColor = '#4caf50';
    let isAdmin = false;
    
    let currentMode = 'public';
    let activeDmUser = null;
    let activePartners = [];
    let registeredUsers = [];

    const EMOJIS = ["😀","😂","🤣","😊","😍","😜","😎","🤓","🙈","🔥","✨","🎉","👍","👎","❤️","💀","🍦","👾","🤖","🐧","🚀","💯","💩","🥑"];

    window.onload = () => {
      buildEmojiPicker();
      // Persistent Login check
      const savedUser = localStorage.getItem('smoc_user');
      const savedPin = localStorage.getItem('smoc_pin');
      if (savedUser && savedPin) {
        document.getElementById('username-input').value = savedUser;
        document.getElementById('pin-input').value = savedPin;
        login();
      }
    };

    function login() {
      const username = document.getElementById('username-input').value.trim();
      const pin = document.getElementById('pin-input').value.trim();
      const errDiv = document.getElementById('login-error');

      if (!username || !pin) {
        errDiv.innerText = "Please enter both name and PIN.";
        return;
      }

      socket.emit('login', { username, pin }, (res) => {
        if (!res.success) {
          errDiv.innerText = res.error;
          localStorage.removeItem('smoc_user');
          localStorage.removeItem('smoc_pin');
        } else {
          currentUser = username;
          currentPin = pin;
          isAdmin = res.isAdmin;
          currentColor = res.nameColor || '#4caf50';

          localStorage.setItem('smoc_user', username);
          localStorage.setItem('smoc_pin', pin);

          document.getElementById('color-picker').value = currentColor;
          document.getElementById('login-overlay').style.display = 'none';
          document.getElementById('user-display').innerText = `Logged in as: ${currentUser}${isAdmin ? ' (Admin 🔥)' : ''}`;

          res.messages.forEach(renderPublicMessage);
          scrollToBottom();
          loadDmData();
        }
      });
    }

    function switchAccount() {
      localStorage.removeItem('smoc_user');
      localStorage.removeItem('smoc_pin');
      location.reload();
    }

    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('btn-mode-public').classList.toggle('active', mode === 'public');
      document.getElementById('btn-mode-dm').classList.toggle('active', mode === 'dm');
      document.getElementById('dm-sidebar-section').style.display = mode === 'dm' ? 'block' : 'none';

      if (mode === 'public') {
        document.getElementById('room-title').innerText = 'Public Room';
        refreshPublicChat();
      } else {
        if (activeDmUser) {
          openDmChat(activeDmUser);
        } else if (activePartners.length > 0) {
          openDmChat(activePartners[0]);
        } else {
          document.getElementById('room-title').innerText = 'Direct Messages';
          document.getElementById('chat-box').innerHTML = '<div style="color:#777; text-align:center; margin-top:40px;">Select a user or click "+ New" to DM.</div>';
        }
      }
    }

    function loadDmData() {
      socket.emit('get_dm_data', { username: currentUser, pin: currentPin }, (res) => {
        if (res.success) {
          activePartners = res.activePartners;
          registeredUsers = res.allUsers;
          renderActiveDmsList();
        }
      });
    }

    function renderActiveDmsList() {
      const list = document.getElementById('active-dms-list');
      list.innerHTML = '';
      if (activePartners.length === 0) {
        list.innerHTML = '<li style="font-size:0.8rem; color:#666;">No active DMs yet</li>';
        return;
      }

      activePartners.forEach(partner => {
        const li = document.createElement('li');
        li.className = `user-item ${partner === activeDmUser && currentMode === 'dm' ? 'active-dm' : ''}`;
        li.innerHTML = `<span>💬 ${partner}</span>`;
        li.onclick = () => openDmChat(partner);
        list.appendChild(li);
      });
    }

    function openDmChat(targetUser) {
      if (targetUser === currentUser) return alert("You cannot DM yourself.");
      
      currentMode = 'dm';
      activeDmUser = targetUser;
      document.getElementById('btn-mode-public').classList.remove('active');
      document.getElementById('btn-mode-dm').classList.add('active');
      document.getElementById('dm-sidebar-section').style.display = 'block';
      document.getElementById('room-title').innerText = `DM with ${targetUser}`;

      if (!activePartners.includes(targetUser)) {
        activePartners.push(targetUser);
      }
      renderActiveDmsList();

      document.getElementById('chat-box').innerHTML = '';
      socket.emit('get_dm_history', { username: currentUser, pin: currentPin, targetUser }, (res) => {
        if (res.success) {
          res.history.forEach(renderDmMessage);
          scrollToBottom();
        }
      });
    }

    function promptNewDm() {
      const target = prompt(`Enter username to DM:\nRegistered users: ${registeredUsers.join(', ')}`);
      if (target) {
        const cleaned = target.trim();
        if (cleaned && cleaned !== currentUser) {
          openDmChat(cleaned);
        }
      }
    }

    function sendMessage() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text) return;

      // Handle Slash Commands
      if (text === '/emoji') {
        toggleEmojiPicker();
        input.value = '';
        return;
      }
      if (text.startsWith('/name ')) {
        const newColor = text.replace('/name ', '').trim();
        updateNameColor(newColor);
        input.value = '';
        return;
      }

      if (currentMode === 'public') {
        socket.emit('send_message', { username: currentUser, pin: currentPin, text });
      } else if (currentMode === 'dm' && activeDmUser) {
        socket.emit('send_dm', { username: currentUser, pin: currentPin, recipient: activeDmUser, text });
      }
      input.value = '';
      document.getElementById('emoji-picker').style.display = 'none';
    }

    function updateNameColor(color) {
      currentColor = color;
      socket.emit('set_name_color', { username: currentUser, pin: currentPin, color });
    }

    function renderPublicMessage(msg) {
      if (currentMode !== 'public') return;
      const box = document.getElementById('chat-box');
      const div = document.createElement('div');
      
      div.className = `message ${msg.username === currentUser ? 'mine' : ''} ${msg.isFiltered ? 'filtered-msg' : ''}`;
      div.id = `msg-${msg.id}`;

      const isOwner = msg.username === currentUser;

      let actionsHtml = '';
      if (isOwner) actionsHtml += `<i class="action-icon" onclick="editMsg('${msg.id}', \`${msg.text}\`)">✏️</i>`;
      if (isOwner || isAdmin) actionsHtml += `<i class="action-icon" onclick="deleteMsg('${msg.id}')">🗑️</i>`;

      div.innerHTML = `
        <div class="msg-header">
          <span class="msg-author" style="color: ${msg.color || '#4caf50'}">${msg.username}</span>
          <span>${msg.time}</span>
          <span class="actions">${actionsHtml}</span>
        </div>
        <div class="msg-text">${msg.text}</div>
      `;

      box.appendChild(div);
      scrollToBottom();
    }

    function renderDmMessage(msg) {
      const box = document.getElementById('chat-box');
      const div = document.createElement('div');
      div.className = `message ${msg.sender === currentUser ? 'mine' : ''} ${msg.isFiltered ? 'filtered-msg' : ''}`;

      div.innerHTML = `
        <div class="msg-header">
          <span class="msg-author" style="color: ${msg.color || '#4caf50'}">${msg.sender}</span>
          <span>${msg.time}</span>
        </div>
        <div class="msg-text">${msg.text}</div>
      `;

      box.appendChild(div);
      scrollToBottom();
    }

    function refreshPublicChat() {
      document.getElementById('chat-box').innerHTML = '';
      socket.emit('login', { username: currentUser, pin: currentPin }, (res) => {
        if (res.success) {
          res.messages.forEach(renderPublicMessage);
          scrollToBottom();
        }
      });
    }

    /* Admin Action Handlers */
    function deleteMsg(id) {
      if (confirm("Delete this message?")) {
        socket.emit('delete_message', { username: currentUser, pin: currentPin, messageId: id });
      }
    }

    function toggleMute(targetUser) {
      socket.emit('toggle_mute', { username: currentUser, pin: currentPin, targetUsername: targetUser });
    }

    function banUser(targetUser) {
      if (confirm(`PERMANENTLY BAN ${targetUser}?`)) {
        socket.emit('ban_user', { username: currentUser, pin: currentPin, targetUsername: targetUser });
      }
    }

    function editMsg(id, oldText) {
      const newText = prompt("Edit your message:", oldText);
      if (newText && newText !== oldText) {
        socket.emit('edit_message', { username: currentUser, pin: currentPin, messageId: id, newText });
      }
    }

    /* Emoji Picker Helpers */
    function buildEmojiPicker() {
      const picker = document.getElementById('emoji-picker');
      picker.innerHTML = '';
      EMOJIS.forEach(e => {
        const span = document.createElement('span');
        span.className = 'emoji-item';
        span.innerText = e;
        span.onclick = () => {
          document.getElementById('message-input').value += e;
        };
        picker.appendChild(span);
      });
    }

    function toggleEmojiPicker() {
      const picker = document.getElementById('emoji-picker');
      picker.style.display = picker.style.display === 'grid' ? 'none' : 'grid';
    }

    /* Socket Listener Events */
    socket.on('new_message', (msg) => {
      if (currentMode === 'public') renderPublicMessage(msg);
    });

    socket.on('new_dm', ({ key, msg }) => {
      const otherUser = msg.sender === currentUser ? msg.recipient : msg.sender;
      if (!activePartners.includes(otherUser)) {
        activePartners.push(otherUser);
        renderActiveDmsList();
      }
      if (currentMode === 'dm' && activeDmUser === otherUser) {
        renderDmMessage(msg);
      }
    });

    socket.on('chat_error', (errMsg) => {
      alert(errMsg);
    });
    
    socket.on('message_deleted', (id) => {
      const el = document.getElementById(`msg-${id}`);
      if (el) el.remove();
    });

    socket.on('message_edited', ({ id, newText }) => {
      const el = document.getElementById(`msg-${id}`);
      if (el) el.querySelector('.msg-text').innerText = newText;
    });

    socket.on('user_banned', (targetUser) => {
      if (currentUser === targetUser) {
        alert("Your account has been banned by Admin.");
        switchAccount();
      }
    });

    socket.on('update_online_users', (users) => {
      document.getElementById('online-count').innerText = users.length;
      const list = document.getElementById('online-list');
      list.innerHTML = '';
      users.forEach(u => {
        const li = document.createElement('li');
        li.className = 'user-item';

        let adminControls = '';
        if (isAdmin && u.username !== 'admin') {
          adminControls = `
            <span style="display:inline-flex; gap:4px;">
              <button class="admin-btn btn-mute" onclick="toggleMute('${u.username}')">${u.isMuted ? 'Unmute' : 'Mute'}</button>
              <button class="admin-btn btn-ban" onclick="banUser('${u.username}')">Ban</button>
            </span>
          `;
        }

        li.innerHTML = `
          <span onclick="openDmChat('${u.username}')" style="cursor:pointer;">
            <span class="online-dot"></span> 
            <span style="color:${u.color}">${u.username}</span> 
            ${u.isMuted ? '<span class="muted-badge">Muted</span>' : ''}
          </span>
          ${adminControls}
        `;
        list.appendChild(li);
      });
    });

    /* Font & Theme Selectors */
    function changeFont(font) {
      document.documentElement.style.setProperty('--app-font', font);
      localStorage.setItem('smoc_font', font);
    }

    function changeTheme(theme) {
      const root = document.documentElement.style;
      if (theme === 'sunset') {
        root.setProperty('--bg-color', '#1f1124');
        root.setProperty('--card-bg', '#2b1731');
        root.setProperty('--header-bg', '#381c40');
        root.setProperty('--accent-color', '#ff5722');
        root.setProperty('--text-color', '#fff');
        root.setProperty('--msg-bg', '#4a2354');
        root.setProperty('--msg-mine-bg', '#7b1fa2');
      } else if (theme === 'ocean') {
        root.setProperty('--bg-color', '#0a192f');
        root.setProperty('--card-bg', '#112240');
        root.setProperty('--header-bg', '#1d3557');
        root.setProperty('--accent-color', '#64ffda');
        root.setProperty('--text-color', '#e6f1ff');
        root.setProperty('--msg-bg', '#233554');
        root.setProperty('--msg-mine-bg', '#0077b6');
      } else if (theme === 'dracula') {
        root.setProperty('--bg-color', '#282a36');
        root.setProperty('--card-bg', '#44475a');
        root.setProperty('--header-bg', '#6272a4');
        root.setProperty('--accent-color', '#ff79c6');
        root.setProperty('--text-color', '#f8f8f2');
        root.setProperty('--msg-bg', '#6272a4');
        root.setProperty('--msg-mine-bg', '#bd93f9');
      } else if (theme === 'golden') {
        root.setProperty('--bg-color', '#111111');
        root.setProperty('--card-bg', '#1c1a17');
        root.setProperty('--header-bg', '#2a2620');
        root.setProperty('--accent-color', '#ffd700');
        root.setProperty('--text-color', '#fff8e7');
        root.setProperty('--msg-bg', '#332d23');
        root.setProperty('--msg-mine-bg', '#544622');
      } else if (theme === 'matrix') {
        root.setProperty('--bg-color', '#050d05');
        root.setProperty('--card-bg', '#0a1a0a');
        root.setProperty('--header-bg', '#0f260f');
        root.setProperty('--accent-color', '#00ff00');
        root.setProperty('--text-color', '#00ff00');
        root.setProperty('--msg-bg', '#123312');
        root.setProperty('--msg-mine-bg', '#1a4d1a');
      } else if (theme === 'cyberpunk') {
        root.setProperty('--bg-color', '#1a0022');
        root.setProperty('--card-bg', '#2d0036');
        root.setProperty('--header-bg', '#40004d');
        root.setProperty('--accent-color', '#ff007f');
        root.setProperty('--text-color', '#00ffff');
        root.setProperty('--msg-bg', '#4a0052');
        root.setProperty('--msg-mine-bg', '#660070');
      } else if (theme === 'light') {
        root.setProperty('--bg-color', '#e0e0e0');
        root.setProperty('--card-bg', '#ffffff');
        root.setProperty('--header-bg', '#f5f5f5');
        root.setProperty('--accent-color', '#2196f3');
        root.setProperty('--text-color', '#222222');
        root.setProperty('--msg-bg', '#eeeeee');
        root.setProperty('--msg-mine-bg', '#bbdefb');
      } else {
        root.setProperty('--bg-color', '#121212');
        root.setProperty('--card-bg', '#181818');
        root.setProperty('--header-bg', '#222222');
        root.setProperty('--accent-color', '#4caf50');
        root.setProperty('--text-color', '#ffffff');
        root.setProperty('--msg-bg', '#262626');
        root.setProperty('--msg-mine-bg', '#1e3a29');
      }
      localStorage.setItem('smoc_theme', theme);
    }

    const savedFont = localStorage.getItem('smoc_font');
    if (savedFont) {
      document.getElementById('font-select').value = savedFont;
      changeFont(savedFont);
    }
    const savedTheme = localStorage.getItem('smoc_theme');
    if (savedTheme) {
      document.getElementById('theme-select').value = savedTheme;
      changeTheme(savedTheme);
    }

    function scrollToBottom() {
      const box = document.getElementById('chat-box');
      box.scrollTop = box.scrollHeight;
    }
  </script>
</body>
</html>
